name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Unit tests
        run: python -m pytest -q --cov=navfm --cov-report=term-missing

  upstream-compat:
    # The claim that generated data loads through the reference ViNT_Dataset is
    # the central claim of this repo, so it is tested against the real thing,
    # not a mock. CPU torch only -- no model is instantiated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Clone the reference implementation
        run: |
          git clone --depth 1 https://github.com/robodhruv/visualnav-transformer.git \
            third_party/visualnav-transformer

      - name: Install
        run: |
          python -m pip install -U pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" lmdb tqdm

      - name: Compatibility proof
        env:
          NAVFM_UPSTREAM: third_party/visualnav-transformer
        run: python -m pytest tests/test_upstream_compat.py -q
