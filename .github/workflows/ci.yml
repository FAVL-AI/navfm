name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Unit tests
        run: python -m pytest -q --cov=navfm --cov-report=term-missing

  upstream-compat:
    # The claim that generated data loads through the reference ViNT_Dataset is
    # the central claim of this repo, so it is tested against the real thing,
    # not a mock. This job runs every `upstream`-marked test, which now also
    # covers the model geometry and the loss/metric definitions -- each of those
    # is a place where our reading of upstream could be wrong, so each is
    # settled against upstream rather than against our own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Clone the reference implementation
        run: |
          git clone --depth 1 https://github.com/robodhruv/visualnav-transformer.git \
            third_party/visualnav-transformer

      - name: Install
        run: |
          python -m pip install -U pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" lmdb tqdm
          # vint_train.training.train_utils -- the loss oracle -- imports the
          # whole visualisation stack transitively. headless opencv per
          # docs/REPRODUCTION.md (the pinned 4.6.0.66 has no wheels past 3.10).
          pip install efficientnet_pytorch wandb prettytable matplotlib diffusers \
                      opencv-python-headless

      - name: Compatibility proof
        env:
          NAVFM_UPSTREAM: third_party/visualnav-transformer
          MPLBACKEND: Agg
          WANDB_MODE: disabled
        run: python -m pytest -m upstream -q
