[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navfm"
version = "0.1.0"
description = "Reproducible GNM / ViNT / NoMaD research infrastructure with Isaac Sim data collection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frank Asante Van Laarhoven", email = "frankleroyvan@gmail.com" }]
keywords = ["robotics", "visual-navigation", "foundation-models", "isaac-sim", "sim2real"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training/eval. Torch is pinned deliberately: see docs/REPRODUCTION.md.
# torch >= 2.6 flipped torch.load's weights_only default, which breaks the
# released ViNT/GNM checkpoints; navfm.models.loader handles that explicitly.
train = [
  "torch>=2.6,<3",
  "torchvision>=0.21",
  "efficientnet_pytorch>=0.7.1",
  "diffusers>=0.11.1",
  "huggingface_hub>=0.25,<1",
  "warmup-scheduler @ git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git",
  "lmdb>=1.4",
  "tqdm>=4.66",
  "wandb>=0.17",
  "prettytable>=3.9",
  # Not used by this package. `vint_train.training.train_utils` imports both at
  # module level, so without them the upstream compatibility proof -- which is
  # the specification -- SKIPS rather than fails, and the suite still reports a
  # green run. Headless opencv deliberately: the pinned opencv-python has no
  # wheels for Python >= 3.11 and its PyQt5 conflict aborts the process.
  # See gates/failures/F-M2-1.md.
  "matplotlib>=3.8",
  "opencv-python-headless>=4.9",
]
# rosbag/roslz4 have no wheels past cp38; only needed to convert SACSoN /
# SCAND / TartanDrive bags. Requires liblz4-dev and a C compiler.
convert = [
  "h5py>=3.10",
  "opencv-python-headless>=4.9",
  "rosbags>=0.9",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
navfm-validate = "navfm.validate:main"
navfm-stats = "navfm.stats:main"
navfm-splits = "navfm.splits:main"
navfm-collect = "navfm.isaac.collect:main"

[project.urls]
Repository = "https://github.com/FAVL-AI/navfm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "isaac: requires an Isaac Sim installation",
  "torch: requires PyTorch",
  "upstream: requires the reference visualnav-transformer package",
  "slow: long-running",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF046: false positive on int(np.rint(...)) -- numpy returns a float64.
ignore = ["E501", "B008", "RUF046"]

[tool.mypy]
# No python_version override: CI typechecks under 3.10, 3.11 and 3.12, so each
# leg must target the language version it is actually running. Pinning the
# target to 3.10 made mypy refuse numpy's 3.12 stubs on the 3.12 runner --
# it aborted inside numpy/__init__.pyi before checking a single project file,
# so that leg measured nothing while reporting a failure.
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/navfm"]

[tool.coverage.run]
source = ["navfm"]
omit = ["*/isaac/*"]
